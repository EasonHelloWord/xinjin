# Xinjin production example.
# Assumptions:
# - Front-end build output is in /opt/tools/xinjin/front-end/dist
# - Back-end listens on 127.0.0.1:8787
# - The app is published at https://tools.easonjan.top/xinjin
# - OIDC issuer is https://auth.easonjan.top

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $http_origin $xinjin_cors_origin {
  default "";
  "https://tools.easonjan.top" $http_origin;
}

server {
  listen 443 ssl http2;
  server_name tools.easonjan.top;

  # ssl_certificate /etc/letsencrypt/live/tools.easonjan.top/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/tools.easonjan.top/privkey.pem;

  location = /xinjin {
    return 301 /xinjin/;
  }

  location = /xinjin/index.html {
    alias /opt/tools/xinjin/front-end/dist/index.html;
  }

  location /xinjin/ {
    alias /opt/tools/xinjin/front-end/dist/;
    error_page 404 =302 /xinjin/;
    try_files $uri $uri/ /xinjin/index.html;
  }

  location /xinjin/api/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $xinjin_cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
      add_header Access-Control-Allow-Credentials "true" always;
      add_header Access-Control-Max-Age 86400 always;
      add_header Content-Length 0;
      add_header Content-Type text/plain;
      return 204;
    }

    proxy_pass http://127.0.0.1:8787/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;

    add_header Access-Control-Allow-Origin $xinjin_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    add_header Access-Control-Allow-Credentials "true" always;
  }

  location /xinjin/oauth/ {
    proxy_pass http://127.0.0.1:8787/oauth/;
    proxy_http_version 1.1;
    proxy_set_header Host auth.easonjan.top;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /xinjin/ws {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }
}

server {
  listen 443 ssl http2;
  server_name auth.easonjan.top;

  # ssl_certificate /etc/letsencrypt/live/auth.easonjan.top/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/auth.easonjan.top/privkey.pem;

  location ~ ^/(oauth/token|oauth/userinfo|oauth/revoke|admin/clients|\.well-known/openid-configuration|\.well-known/jwks\.json)$ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $xinjin_cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
      add_header Access-Control-Max-Age 86400 always;
      add_header Content-Length 0;
      add_header Content-Type text/plain;
      return 204;
    }

    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;

    add_header Access-Control-Allow-Origin $xinjin_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
  }

  location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
